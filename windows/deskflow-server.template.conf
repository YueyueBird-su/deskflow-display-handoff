# Deskflow 1.27.0 supplemental external config.
# Define both computers in the GUI first, then replace both placeholders.
# This file is not a standalone deskflow-core config.
section: links
    __WINDOWS_SCREEN__:
        right = __MAC_SCREEN__
    __MAC_SCREEN__:
        left = __WINDOWS_SCREEN__
end

section: options
    keystroke(control+alt+shift+F22) = switchToScreen(__WINDOWS_SCREEN__), lockCursorToScreen(on)
    keystroke(control+alt+shift+F23) = lockCursorToScreen(off), switchToScreen(__MAC_SCREEN__)
end
